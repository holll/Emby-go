# Emby-go 服务默认配置示例
# 用法：复制为 config.yaml（本文件可安全入库），再按需修改：
#   cp config.example.yaml config.yaml
#   ./metatube            # 默认读 config.yaml
#   ./metatube -c x.yaml  # 或指定其它配置文件
# 注意：直接以本文件运行会把自动生成的 server_id 回写到本文件，请勿直接运行本示例。

# 监听端口
port: 18080

# 原始请求调试模式（修改后重启生效，默认关闭；Gin仍为release模式）。
# true：不脱敏请求路径/全部query/请求头/请求体/错误与panic，不跳过图片、静态资源、流请求。
# 危险：密码、token、Cookie、Webhook地址等会写入log/request-*.log；仅临时排障，勿公开日志！
# 保留API原有请求体大小限制；不转储响应体或视频内容。会增加内存、磁盘占用与请求延迟。
debug: false

# SQLite 数据文件路径（相对路径基于进程启动目录）
db_path: "emby-go.db"

# 站点名（Emby 客户端登录后显示的名称）
server_name: "Emby-go"

# 服务唯一标识（ServerId）。
# 留空：首次启动自动生成稳定 UUID 并存入 db 对应的 kv，重启不变。
# 若需固定（如迁移/多实例），填一段全局唯一字符串。
server_id: ""

# Redis 为必选缓存后端：地址必填，连不上/Ping 失败将拒绝启动。
redis_addr: "127.0.0.1:6379"   # 可选；留空或不可达时使用进程内缓存
redis_password: ""
redis_db: 0

# 登录会话有效期（天）。使用中自动滑动续期；0 表示永不过期。
# 设置页可「退出全部会话」立即撤销所有登录令牌；API 密钥不受影响。
session_ttl_days: 30

# 首次初始化的引导保护（D04）。
# setup_code 非空时，POST /api/auth/initialize 必须携带相同 Code；建议公网/共享环境设置。
setup_code: ""
# 仅允许这些 CIDR 来源调用首次初始化；留空不限制（会记录警告）。
# initialize_allow_from: ["127.0.0.1/32", "10.0.0.0/8"]

# 反向代理 CIDR 白名单。为空时不信任 X-Forwarded-For（限流/日志用 TCP 对端地址）。
# 只有反向代理与本站同机且确认会覆盖代理头时才配置。
# trusted_proxies: ["127.0.0.1/32"]

# 前端“服务器域名切换”候选列表（供 Web 客户端在多个入口间切换；可选）
# server_domains:
#   - name: "内网"
#     url: "http://127.0.0.1:18080/emby"
#   - name: "公网"
#     url: "https://emby.example.com/emby"
server_domains: []

# ---- 可订阅的 Emby 风格 webhook（默认关闭）----
# events 缺省/空列表只订阅 item.deleted，兼容旧配置；其它事件必须显式列出，不支持 *。
# 支持 item.deleted/item.updated/item.markplayed/item.markunplayed/item.rate/item.unrate，
# playback.start/playback.progress/playback.stop/playback.pause/playback.unpause，
# user.authenticated/user.logout。显式列表替换默认值；重复允许，未知值拒绝启动。
# playback.progress 高频且同步发送，请谨慎订阅；不重试、不持久化。
# item.deleted 仅显式管理删除影片时发送，扫描/删库绝不发送删除通知。
# Date 与 Timestamp 同为 RFC3339 时间；用户事件无媒体条目时 Item 为 {}（保持值类型 API）。
# User/Session/PlaybackInfo 按需提供，不包含访问令牌或 STRM 内容 URL。
# URL 可能包含密钥，切勿输出到日志。启用前核对 SmartStrm 的路径映射和允许范围！
# SmartStrm 会把原始本地 .strm 路径映射为远端整个文件夹删除，可能影响同目录其它影片。
# 2xx 仅表示接收确认，不证明远端删除完成；ignored/未启用响应会报告失败。
# 推荐在管理后台 → 设置 → Webhook 配置，保存即时生效并持久化到数据库。
# 本段仅为没有后台配置时的启动后备值；已有后台配置不会被 YAML 覆盖。
webhook:
  enabled: false
  events: []               # 空时仅 item.deleted；例 [item.updated, playback.start, user.logout]
  format: json             # json 兼容 SmartStrm；form 为 urlencoded 的 data=<JSON>，用于部分 Emby 接收器
  url: ""                  # http(s)；禁止 userinfo 与 fragment
  timeout_seconds: 5       # 1..30 秒，0 使用默认 5；包含响应体读取
  allow_private: false     # 访问私网/回环需显式开启；仍遵循统一出站安全策略

# ---- 媒体信息探测（与扫库相互独立）----
# 媒体墙「探测媒体信息」按钮 / POST /api/admin/probe/media 调用系统 ffprobe 读取
# 真实码率、分辨率、编码等参数。
#
# 探测会写入两类产物：
#   1) 影片 NFO 的 <fileinfo>：<size>/<probeversion>/<probeurl>/<streamdetails>，
#      是 Emby 客户端读到媒体信息的地方；
#   2) .strm 同目录的 mediainfo.json：ffprobe 的完整原始输出 + 探测版本 + 直链。
#
# 第 2 项是「不重复探测」的关键：它保存了未经裁剪的原始数据，
# 因此已探测过的条目在全库探测中只读文件、不发 ffprobe 请求；
# 将来探测新增字段时也能直接从原始数据本地回填，无需重新联网。
# 分集影片（CD1/CD2…）的每个 .strm 各自探测、各自生成一份 mediainfo.json；
# 同目录只有一个 .strm 时为 mediainfo.json，多个时为 <文件名>.mediainfo.json 以免互相覆盖。
# 探测不写索引库；NFO 与 mediainfo.json 是数据真源，参数在下一次扫库时被带回库中。
# 前置条件：影片已有 NFO（无 NFO 的待补录条目会被跳过）。
ffprobe_path: ""          # ffprobe 可执行文件路径；留空则从 PATH 查找
probe_timeout_seconds: 90 # 单条探测超时（秒）：远程直链建连+读取较慢，建议不低于 30
probe_concurrency: 2      # 并发探测数（上限 8）：过高会拖慢网盘/代理，反而整体变慢

