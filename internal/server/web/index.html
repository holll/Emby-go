<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Emby-go · 控制台</title>
<link rel="stylesheet" href="/web/style.css">
<link rel="stylesheet" href="/web/dashboard.css">
<link rel="stylesheet" href="/web/artwork.css">
<link rel="stylesheet" href="/web/sprites.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳到主内容</a>
<div id="app-shell">
  <aside id="nav-drawer" class="sidebar" aria-label="控制台菜单" tabindex="-1">
    <div class="brand">
      <button id="nav-close" class="icon-btn nav-close" type="button" aria-label="关闭菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <span class="brand-mark" aria-hidden="true">E</span>
      <div class="brand-text">
        <strong>Emby-go</strong>
        <small>NFO · 档案控制台</small>
      </div>
    </div>

    <nav id="nav" class="nav" aria-label="主导航">
      <button class="nav-item" data-page="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>总览</span>
      </button>
      <section class="nav-group" aria-label="内容管理">
        <h2 class="nav-group-label">内容管理</h2>
      <button class="nav-item" data-page="libraries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>媒体库</span>
      </button>
      <button class="nav-item" data-page="items">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="m9.5 13 3 2 2-1.5"/><circle cx="8" cy="12.5" r=".5"/></svg>
        <span>媒体墙</span>
      </button>
      </section>
      <section class="nav-group" aria-label="资料处理">
        <h2 class="nav-group-label">资料处理</h2>
      <button class="nav-item" data-page="scrape">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3"/><path d="M12 18v3"/><circle cx="12" cy="12" r="4"/><path d="M3 12h3M18 12h3"/></svg>
        <span>刮削与翻译</span>
      </button>
      </section>
      <section class="nav-group" aria-label="自动化">
        <h2 class="nav-group-label">自动化</h2>
      <button class="nav-item" data-page="scheduled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>计划任务</span>
      </button>
      <button class="nav-item" data-page="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 12h7M4 18h7"/><path d="m15 15 2 2 4-4"/></svg>
        <span>任务中心</span>
      </button>
      </section>
      <section class="nav-group" aria-label="运维诊断">
        <h2 class="nav-group-label">运维诊断</h2>
      <button class="nav-item" data-page="logs" id="nav-logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 9h10M4 13h16M4 17h7"/><path d="M17 15l2 2-2 2"/></svg>
        <span>运行日志</span>
      </button>
      <button class="nav-item" data-page="firewall">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="M8 12h8M12 8v8"/></svg>
        <span>防火墙</span>
      </button>
      </section>
      <section class="nav-group" aria-label="账户与安全">
        <h2 class="nav-group-label">账户与安全</h2>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>设置</span>
      </button>
      </section>
    </nav>

    <footer class="side-foot"><span class="status-dot" aria-hidden="true"></span><a class="foot-link" href="{{REPO_URL}}" target="_blank" rel="noopener noreferrer">holll/Emby-go</a><span class="foot-sep">·</span><button id="version-btn" class="foot-ver" type="button" title="检查更新" aria-haspopup="dialog"><span id="version-text">{{VERSION}}</span><span id="version-badge" class="foot-badge" hidden>有新版本</span></button></footer>
  </aside>

  <div id="nav-backdrop" class="nav-backdrop" hidden aria-hidden="true"></div>
  <main class="main" id="main-content">
    <header class="topbar">
      <div class="page-heading">
        <button id="nav-toggle" class="btn nav-toggle" type="button" aria-expanded="false" aria-controls="nav-drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>菜单</span></button>
        <div>
        <p class="crumb" id="page-eyebrow">Archive / Index</p>
        <h1 id="page-title">总览</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="logout" class="btn account-action" type="button" aria-label="退出当前会话" title="退出当前会话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4H4v16h5M14 8l4 4-4 4M9 12h12"/></svg><span>退出</span></button>
      </div>
    </header>

    <div id="content" class="content" aria-live="polite"></div>
  </main>
</div>

<dialog id="scrape-overlay" class="scrape-overlay" aria-label="刮削结果预览">
  <div class="scrape-modal">
    <div class="scrape-head">
      <strong>刮削预览与确认</strong>
      <button id="scrape-close" class="icon-btn" type="button" title="取消 (Esc)" aria-label="关闭刮削预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="scrape-body" class="scrape-body"></div>
  </div>
</dialog>

<dialog id="detail-overlay" class="detail-overlay" aria-label="影片详情">
  <aside id="detail-drawer" class="detail-drawer"></aside>
</dialog>

<dialog id="player-overlay" class="player-overlay" aria-label="播放器">
  <div class="player-shell">
    <div class="player-head">
      <strong id="player-title">播放</strong>
      <button id="player-close" class="icon-btn" type="button" title="关闭 (Esc)" aria-label="关闭播放器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="player-stage" class="player-stage"></div>
  </div>
</dialog>

<section id="scan-progress" class="scan-progress" hidden aria-label="媒体库扫描任务">
  <div class="scan-progress-top">
    <span class="scan-progress-label">媒体库扫描</span>
    <button id="scan-progress-close" class="icon-btn" type="button" aria-label="收起扫描结果" title="收起扫描结果（不会取消任务）" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <strong id="scan-progress-title" role="status" aria-live="polite" aria-atomic="true">正在准备扫描…</strong>
  <progress id="scan-progress-fill" max="100" aria-labelledby="scan-progress-title" aria-describedby="scan-progress-count">扫描进度</progress>
  <div class="scan-progress-meta">
    <span id="scan-progress-count">总量待确认</span>
    <span>后台运行，可继续浏览</span>
  </div>
  <small id="scan-progress-detail"></small>
</section>

<dialog id="update-overlay" class="scrape-overlay" aria-labelledby="update-title">
  <div class="scrape-modal update-modal">
    <div class="update-head">
      <strong id="update-title">更新 Emby-go</strong>
      <button id="update-close" class="icon-btn" type="button" title="关闭 (Esc)" aria-label="关闭更新对话框"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="update-body">
      <p class="update-line">当前版本 <code id="update-current">—</code></p>
      <p class="update-line">最新版本 <code id="update-latest">—</code></p>
      <p id="update-summary" class="update-summary">正在检查更新…</p>
      <div id="update-notes" class="update-notes" hidden></div>
      <p id="update-status" class="update-status" hidden></p>
      <div id="update-progress" class="update-progress" hidden>
        <div class="update-progress-track"><i id="update-progress-fill"></i></div>
        <p id="update-progress-label" class="update-progress-label"></p>
      </div>
      <p class="update-hint">升级会下载并校验新程序，成功后服务正常关闭并由 systemd 重启；不保留旧版本，也不支持自动回退。升级期间请勿重复操作。</p>
    </div>
    <div class="update-actions">
      <button id="update-check" class="btn" type="button">重新检查</button>
      <button id="update-apply" class="btn btn-accent" type="button" hidden>立即升级</button>
      <button id="update-reload" class="btn btn-accent" type="button" hidden>重新加载页面</button>
      <button id="update-later" class="btn" type="button">关闭</button>
    </div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="assertive"></div>
<script src="/web/vendor/artplayer.min.js" defer></script>
<script src="/web/webhook-settings.js" defer></script>
<script src="/web/log-settings.js" defer></script>
<script src="/web/image-cache-settings.js" defer></script>
<script src="/web/collection-cover-settings.js" defer></script>
<script src="/web/navigation.js" defer></script>
<script src="/web/dashboard.js" defer></script>
<script src="/web/task-runner.js" defer></script>
<script src="/web/artwork.js" defer></script>
<script src="/web/sprites.js" defer></script>
<script src="/web/security.js" defer></script>
<script src="/web/log-stream.js" defer></script>
<script src="/web/emby.js" defer></script>
<script src="/web/player.js" defer></script>
<script src="/web/app.js" defer></script>
</body>
</html>
