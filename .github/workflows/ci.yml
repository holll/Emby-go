name: ci

# main 分支推送与 PR 跑完整回归；发布仍由 release.yml 的 v* tag 触发。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支的新推送取消旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 格式门禁：避免机器生成/手写混排的 diff 进入主干。
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Coverage gate (≥70%)
        run: |
          set -o pipefail
          go test -coverprofile=cover.out ./... 2>&1 | tee /tmp/test.log
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="${total}" 'BEGIN { exit !(t+0 >= 70) }'

      - name: Test
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/test.log

      # 失败时把具体测试名写进 annotations，便于在没有日志下载权限时定位。
      - name: Test failure details
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            detail=$(awk '/^--- FAIL|^panic:/ { found=1 } found { print; lines++ } lines >= 8 { exit }' /tmp/test.log)
            if [ -z "$detail" ]; then detail='Go test or coverage gate failed; see the failing step log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi

      # 认证限流、请求预算、出站策略与播放会话计数是并发敏感路径，额外跑 race。
      - name: Race (auth/outbound/store)
        run: go test -race -count=1 ./internal/server ./internal/outbound ./internal/store

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 漏洞门禁要最新的补丁版：go.mod 的 1.27.0 不含之后修复的 stdlib CVE。
          go-version: '1.27.x'
          cache: true

      # 依赖漏洞门禁：只允许「未被调用」的模块漏洞，调用链命中即失败。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend VM tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap internal/server/web*_test.cjs 2>&1 | tee /tmp/web-test.log

      # 将首个失败断言写进公开 annotations，不再只看到 exit code 1。
      - name: Frontend failure details
        if: failure()
        run: |
          if [ -f /tmp/web-test.log ]; then
            detail=$(awk '/^not ok / { found=1 } found { print; lines++ } found && (/^  \.\.\./ || lines >= 60) { exit }' /tmp/web-test.log)
            if [ -z "$detail" ]; then detail='Frontend tests failed before a TAP assertion; see Frontend VM tests log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi
