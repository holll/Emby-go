name: ci

# main/PR 与 release 共用核心 Go 门禁；专项检查见 manual-checks.yml。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# 同一分支的新推送取消旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 格式门禁：避免机器生成/手写混排的 diff 进入主干。
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee /tmp/test.log

      # 失败时把具体测试名写进 annotations，便于在没有日志下载权限时定位。
      - name: Test failure details
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            detail=$(awk '/^--- FAIL|^panic:/ { found=1 } found { print; lines++ } lines >= 8 { exit }' /tmp/test.log)
            if [ -z "$detail" ]; then detail='Go test failed; see the failing step log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi
