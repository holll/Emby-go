name: ci

# main 分支推送与 PR 跑完整回归；发布仍由 release.yml 的 v* tag 触发。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支的新推送取消旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 格式门禁：避免机器生成/手写混排的 diff 进入主干。
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 一次未缓存的完整测试同时产出覆盖率，避免同一套测试顺序跑两遍。
      - name: Test and coverage gate (≥70%)
        run: |
          set -o pipefail
          go test -count=1 -coverprofile=cover.out ./... 2>&1 | tee /tmp/test.log
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="${total}" 'BEGIN { exit !(t+0 >= 70) }'

      - name: Validate exact test shard planner
        run: python3 .github/scripts/test_shard_test.py

      # 失败时把具体测试名写进 annotations，便于在没有日志下载权限时定位。
      - name: Test failure details
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            detail=$(awk '/^--- FAIL|^panic:/ { found=1 } found { print; lines++ } lines >= 8 { exit }' /tmp/test.log)
            if [ -z "$detail" ]; then detail='Go test or coverage gate failed; see the failing step log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi

  # 保留全部 race 测试；server 按真实顶层测试清单做互斥、完备的进程分片，
  # 避免 Gin/slog 全局状态被 t.Parallel 破坏，且不再依赖提高超时上限。
  race:
    name: Race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server-1/4, package: ./internal/server, shard: 0, shards: 4 }
          - { name: server-2/4, package: ./internal/server, shard: 1, shards: 4 }
          - { name: server-3/4, package: ./internal/server, shard: 2, shards: 4 }
          - { name: server-4/4, package: ./internal/server, shard: 3, shards: 4 }
          - { name: store, package: ./internal/store, shard: 0, shards: 1 }
          - { name: outbound, package: ./internal/outbound, shard: 0, shards: 1 }
          - { name: artwork, package: ./internal/artwork, shard: 0, shards: 1 }
          - { name: scanner, package: ./internal/scanner, shard: 0, shards: 1 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Complete race partition
        run: |
          set -o pipefail
          run_args=()
          if [ "${{ matrix.shards }}" -gt 1 ]; then
            # -race 同样用于发现阶段，复用随后运行的编译缓存。
            pattern=$(GOFLAGS="${GOFLAGS:-} -race" python3 .github/scripts/test_shard.py --package "${{ matrix.package }}" --count "${{ matrix.shards }}" --index "${{ matrix.shard }}")
            run_args=(-run "$pattern")
          fi
          go test -race -count=1 -timeout=10m "${run_args[@]}" "${{ matrix.package }}" 2>&1 | tee /tmp/race-test.log

      - name: Race failure details
        if: failure()
        run: |
          if [ -f /tmp/race-test.log ]; then
            detail=$(awk '/^--- FAIL|^panic:|WARNING: DATA RACE/ { found=1 } found { print; lines++ } lines >= 20 { exit }' /tmp/race-test.log)
            if [ -z "$detail" ]; then detail='Race test process failed; see the full package log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 漏洞门禁要最新的补丁版：go.mod 的 1.27.0 不含之后修复的 stdlib CVE。
          go-version: '1.27.x'
          cache: true

      # 依赖漏洞门禁：只允许「未被调用」的模块漏洞，调用链命中即失败。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate required Chromium
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then echo '::error::Chromium is required; browser assertions must not be skipped'; exit 1; fi
          printf 'CHROME_BIN=%s\n' "$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Frontend VM tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap internal/server/web*_test.cjs 2>&1 | tee /tmp/web-test.log

      # 将首个失败断言写进公开 annotations，不再只看到 exit code 1。
      - name: Frontend failure details
        if: failure()
        run: |
          if [ -f /tmp/web-test.log ]; then
            detail=$(awk '/^not ok / { found=1 } found { print; lines++ } found && (/^  \.\.\./ || lines >= 60) { exit }' /tmp/web-test.log)
            if [ -z "$detail" ]; then detail='Frontend tests failed before a TAP assertion; see Frontend VM tests log.'; fi
            detail=${detail//%/%25}
            detail=${detail//$'\r'/%0D}
            detail=${detail//$'\n'/%0A}
            echo "::error::$detail"
          fi
